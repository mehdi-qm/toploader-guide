<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a44">
<title>Top Loader Steps</title>
<style>
  :root {
    --navy: #1f2a44; --green: #1a9e5c; --red: #d62828; --amber: #fff4d6;
    --bg: #f4f5f7; --card: #fff; --text: #1b1b1b; --muted: #666;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 18px; line-height: 1.45;
    padding: env(safe-area-inset-top) 0 0;
  }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 12px 16px 16px; }
  header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  header .part { font-size: 13px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: .04em; flex: 1; }
  header .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: #dde0e6; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--green); transition: width .3s; }
  .card { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); flex: 1; }
  .num { display: inline-flex; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 99px; background: var(--navy); color: #fff; font-weight: 800; font-size: 20px; align-items: center; justify-content: center; margin-bottom: 10px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  ul, ol { margin: 0 0 10px; padding-left: 22px; }
  li { margin-bottom: 6px; }
  .warn { background: var(--amber); border-left: 5px solid #e0a100; padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  .stop { background: #fde8e8; border-left: 5px solid var(--red); padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  .ok { background: #e3f6ec; border-left: 5px solid var(--green); padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  figure { margin: 14px 0 4px; text-align: center; }
  figure a { display: inline-block; max-width: 100%; }
  figure img { max-width: 100%; max-height: 55vh; width: auto; border-radius: 10px; display: block; margin: 0 auto; }
  figure img.wide { width: 100%; }
  ul.todo { list-style: none; padding: 0; margin: 4px 0 12px; }
  ul.todo li { position: relative; padding: 8px 0 8px 30px; border-bottom: 1px solid #eee; }
  ul.todo li:last-child { border-bottom: 0; }
  ul.todo li::before { content: "☐"; position: absolute; left: 0; top: 6px; font-size: 20px; color: var(--navy); }
  figcaption { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }
  .timer { text-align: center; margin: 18px 0 6px; }
  .timer .clock { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--navy); line-height: 1; }
  .timer .clock.done { color: var(--green); }
  .timer button { margin-top: 12px; background: var(--navy); color: #fff; }
  .ask { font-size: 20px; font-weight: 700; text-align: center; margin: 18px 0 10px; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px;
    position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); }
  button, .btn {
    font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 18px; font-size: 20px;
    cursor: pointer; text-align: center; text-decoration: none; display: block; width: 100%;
  }
  .yes { background: var(--green); color: #fff; }
  .help { background: #fff; color: var(--red); border: 3px solid var(--red); }
  .leak { background: var(--red); color: #fff; }
  .back { background: transparent; color: var(--muted); font-size: 16px; font-weight: 600; padding: 10px; }
  .big-emoji { font-size: 72px; text-align: center; margin: 20px 0 0; }
  .center { text-align: center; }
  label.f { display: block; font-weight: 700; margin-bottom: 16px; }
  label.f input { display: block; width: 100%; margin-top: 6px; font: inherit; font-weight: 400; font-size: 18px;
    padding: 14px; border: 2px solid #cfd3da; border-radius: 12px; background: #fff; color: var(--text); -webkit-appearance: none; }
  label.f input:focus { outline: none; border-color: var(--navy); }
  .err { color: var(--red); font-weight: 700; }
  .summary { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin: 16px 0 0; }
  button:active, .btn:active { transform: scale(.98); }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="part" id="part"></div><div class="count" id="count"></div></header>
  <div class="bar"><div id="bar"></div></div>
  <div class="card" id="card"></div>
  <div class="btns" id="btns"></div>
</div>

<script>
const PHONE = "+19179291264";

// Repeated actions, based on "quick_checklist_toploader (1).pdf"
const PUMP_OPEN_WAIT = `<b>OPEN</b> the pump valve (counter-clockwise) and wait <b>30 s</b>`;
const PUMP_CLOSE     = `<b>CLOSE</b> the pump valve (clockwise, SHUT)`;
const LINE_OPEN_WAIT = `<b>OPEN</b> the helium in-line valve (handle <b>ALONG</b> the pipe) and wait <b>5 s</b>`;
const LINE_CLOSE     = `<b>CLOSE</b> the helium in-line valve (handle <b>ACROSS</b> the pipe)`;
const LINE_TO_ZERO   = `<b>OPEN</b> the helium in-line valve until the gauge shows <b>0 bar</b>`;
const TIMER_HINT     = "When the timer is done, tap Yes.";

// Each screen lists the PDF step numbers it covers (p). Photos come from img/sNNN.jpg,
// one per PDF step; steps without a photo in the PDF are skipped automatically.
const STEPS = [
  // ---------- Stage A · Top Loader · Unload + Load ----------
  { p: [1, 2, 3], t: `Is the fridge ready? You must get a <b>YES</b>`,
    list: [`Go to the <b>Sample Exchange</b> tab`, `Click <b>“IS FRIDGE READY FOR SAMPLE EXCHANGE?”</b>`, `Check: green box says <b>YES</b>`],
    stop: "Not YES → STOP. Do not start. Wait or ask.", photos: [1, "fridge-ready-yes.jpg"] },
  { p: [5], t: `Check: black VTI valve is <b>CLOSED</b>` },
  { p: [6], t: `Check: helium in-line valve is <b>CLOSED</b> (handle <b>ACROSS</b> the pipe)` },
  { p: [7], t: `Attach the rough pump hose firmly` },
  { p: [8], t: `Switch the rough pump <b>ON</b> (leave it ON)` },
  { p: [9, 10], t: PUMP_OPEN_WAIT, timer: 30 },
  { p: [11], t: PUMP_CLOSE },
  { p: [12], t: `<b>OPEN</b> the big cylinder handle (counter-clockwise, to the LEFT)` },
  { p: [13], t: `<b>OPEN</b> the small black valve (counter-clockwise)` },
  { p: [14], t: `Check: adjuster knob 3 is lined up. <b>Do not turn it</b>` },
  { p: [15, 16], t: LINE_OPEN_WAIT, timer: 5 },
  { p: [17], t: LINE_CLOSE },
  { p: [18, 19], t: PUMP_OPEN_WAIT, timer: 30 },
  { p: [20], t: PUMP_CLOSE },
  { p: [21, 22], t: LINE_OPEN_WAIT, timer: 5 },
  { p: [23], t: LINE_CLOSE },
  { p: [24, 25], t: PUMP_OPEN_WAIT, timer: 30 },
  { p: [26], t: PUMP_CLOSE },
  { p: [27], t: `<b>OPEN</b> the helium in-line valve and <b>LEAVE IT OPEN</b>` },
  { p: [28, 29], t: `Unplug both cables`,
    list: [`Cable <b>A</b> (black)`, `Cable <b>B</b> (orange “Probe”)`, `Grab the metal ring, not the wire`] },
  { p: [30, 31], t: `<b>OPEN</b> the black VTI valve`,
    list: [`Watch the gauge: needle passes <b>0</b>`, `You hear a <b>hiss</b>`] },
  { p: [32], t: `Put on clean gloves 🧤` },
  { p: [33, 34], t: `Open the KF clamp`, list: [`Loosen the wing-screw`, `Take the KF clamp off`] },
  { p: [35], t: `Place the ladder, check it is steady, then climb up` },
  { p: [36, 37], t: `Take the probe stick out and hang it on the hanger`,
    list: [`Hold the top of the probe stick firmly`, `Lift it straight up, slowly, all the way out`, `Hang it on the hanger`] },
  { p: [38], t: `Check the O-ring. If it moved, put it back and align it` },
  { p: [39], t: `Put the dust cover on the hole, right away` },
  { p: [41], t: `Grab the sample from the sides and pull it down (tweezers if cold)` },
  { p: [42], t: `Put the sample in the sample box`, photos: [] },
  { p: [43], t: `Keep your gloves on 🧤` },
  { p: [44], t: `Find the black dot on the probe stick` },
  { p: [45], t: `Mount the sample holder: V-cut side → black dot` },
  { p: [47], t: `Take the dust cover off the hole` },
  { p: [48], t: `Hang the dust cover on the side of the fridge` },
  { p: [49], t: `Lower the probe stick straight down into the fridge` },
  { p: [50], t: `Check: O-ring sits flat and in place` },
  { p: [52, 53], t: `Plug in both cables`,
    list: [`Cable <b>A</b> (black): turn the ring to lock`, `Cable <b>B</b> (orange “Probe”): hold the metal body`] },
  { p: [54], t: `Put the KF clamp back on, then tighten the wing-screw`,
    list: [`Snug, not over-tight`, `Check: you hear helium blowing out of the VTI valve`] },
  { p: [55], id: "leak-restart", t: LINE_CLOSE },
  { p: [56, 57, 58], t: PUMP_OPEN_WAIT, timer: 30, list: [`Check: needle reaches <b>–1 bar</b>`] },
  { p: [59], t: PUMP_CLOSE },
  { p: [60, 61, 62], photos: [60], t: `<b>LEAK CHECK:</b> watch the gauge for <b>1 min</b>`, timer: 60,
    list: [`Needle must stay on <b>–1 bar</b>`],
    stop: "Needle went up = LEAK → open KF clamp, clean O-ring with cloth + IPA, close clamp, then use the red button to go back.",
    jump: "leak-restart", jumpLabel: "Needle went up → go back" },
  { p: [63], t: LINE_TO_ZERO },
  { p: [64], t: LINE_CLOSE },
  { p: [65, 66], t: PUMP_OPEN_WAIT, timer: 30 },
  { p: [67], t: PUMP_CLOSE },
  { p: [68], t: LINE_TO_ZERO },
  { p: [69], t: LINE_CLOSE },
  { p: [70, 71], t: PUMP_OPEN_WAIT, timer: 30 },
  { p: [72], t: PUMP_CLOSE },
  { p: [73], t: `Switch the rough pump <b>OFF</b>` },
  { p: [74, 75], t: `<b>OPEN</b> the helium in-line valve slowly until the needle is at <b>–0.2 bar</b>`,
    list: [`That is two marks before 0`] },
  { p: [76], t: LINE_CLOSE },
  { p: [77], t: `<b>CLOSE</b> the black VTI valve` },
  { p: [78], t: `Put the red plastic cap on` },
  { p: [79], t: `<b>CLOSE</b> the big cylinder handle (clockwise, to the RIGHT)` },
  { p: [80], t: `<b>CLOSE</b> the small black valve (clockwise)` },
  { p: [81], t: `Take your gloves off. Go to the computer`, ok: "✓ Stage A done → go to the computer" },

  // ---------- Stage B · Software (VdP only) ----------
  { part: "Stage B · Part 3 · Samples Wiring tab", p: [82, 83, 84], t: `Write down the sample names`,
    list: [`Click the <b>Samples Wiring</b> tab`, `Need another row? Click <b>+ Add Sample</b>`, `Type each sample ID in <b>Name</b> (e.g. QM122)`] },
  { p: [85, 86, 87, 88, 89, 90], photos: [85, 90], t: `Write down the wiring`,
    list: [`Check the corner geometry (Rxx, Ryy, Rxy)`, `Type the <b>NW</b>, <b>NE</b>, <b>SE</b> and <b>SW</b> line numbers for every sample`, `Double-check every line number`] },
  { p: [91, 92, 93], t: `Tick all the boxes: <b>Rxx</b>, <b>Ryy</b>, <b>Rxy</b>` },

  { part: "Stage B · Part 4 · Automation tab", p: [94], t: `Click the <b>Automation</b> tab` },
  { p: [95, 96, 97, 98, 99], t: `Set the phase checkboxes`,
    list: [`Phase 1 Room-T B sweep: <b>UNTICK</b>`, `Phase 2 Cooldown: <b>TICK</b>`, `Phase 3 Magnet sweep: <b>TICK</b>`, `Phase 4 Hi-res B sweep: <b>TICK</b>`, `Phase 5 Warm-up: <b>TICK</b>`] },
  { p: [100, 101, 102], t: `Set pressure and cooldown`,
    list: [`Pressure control = <b>Python custom PID</b>`, `Cooldown low P target = <b>7.50 mBar</b>`, `Cooldown base-T threshold = <b>2.50 K</b>`] },
  { p: [103, 104, 105, 106, 107], t: `Set the sensitivity exactly like the photos`,
    list: [`Step 1 Room-T = <b>Auto</b>`, `Step 2 Cooldown = <b>Auto</b>`, `Step 3 Magnet sweep = <b>Auto</b>`, `Step 4 Hi-res = <b>Smart</b>`, `Step 5 Warm-up = <b>Auto</b>`] },
  { p: [108, 109, 110, 111, 112, 113, 114], t: `Set the lock-in values`,
    list: [`Fixed-mode value = <b>10.000 mV</b>`, `Amplitude = <b>1.000 V</b>`, `Frequency = <b>17.777 Hz</b>`, `Time constant = <b>300 ms</b>`, `Bias resistor = <b>1.000 MΩ</b>`, `Lock-in settle = <b>2.0 s</b>`, `Switch settle (slow phases) = <b>1.50 s</b>`] },

  { part: "Stage B · Part 5 · B sweeps", p: [115, 116, 117, 118, 119, 120, 121], t: `Set the Magnet sweep`,
    list: [`Sweep mode = <b>Continuous</b>`, `B start = <b>−0.100 T</b>`, `B max = <b>6.000 T</b>`, `B step = <b>5.0 mT</b>`, `Ramp rate = <b>3.00 mT/s</b>`, `Ramp-back rate = <b>3.00 mT/s</b>`, `Switch settle = <b>1.50 s</b>`] },
  { p: [122, 123, 124, 125, 126], t: `Set the Hi-res sweep`,
    list: [`B start = <b>−0.100 T</b>`, `B stop = <b>6.000 T</b>`, `B step = <b>1.50 mT</b>`, `Ramp rate = <b>2.50 mT/s</b>`, `Post-switch warmup = <b>5.0 s</b>`] },

  { part: "Stage B · Part 6 · Warm-up & output", p: [127, 128, 129], t: `Set the warm-up`,
    list: [`Warm-up target (heater) = <b>300.0 K</b>`, `Done at (exit condition) = <b>295.0 K</b>`, `Sample interval = <b>10 s</b>`] },
  { p: [130, 131, 132], t: `Name the run and check everything`,
    list: [`Sample / run name: type a name + the date`, `Save folder: keep the current folder`, `Check every value against this checklist`],
    stop: "Not sure about any value? Do NOT start. Ask first." },

  { part: "Stage B · Part 7 · Start & monitor", p: [133], t: `Click <b>Start Automation</b>` },
  { p: [134], t: `Watch the log: phase, heater, pressure` },
  { p: [135], t: `Check the elapsed time / ETA bar` },
  { part: "Stage B · Part 7 · Live Data tab", p: [136], t: `Monitor the resistance`,
    list: [`Go to the <b>Live Data</b> tab`, `Y axis: <b>R — resistance</b>`] },
  { p: [137], t: `Monitor the VTI temperature`, list: [`Y axis: <b>T_VTI — VTI Cernox</b>`] },
  { p: [138], t: `Monitor the iTC probe temperature`, list: [`Y axis: <b>T_itc — iTC probe</b>`] },
  { p: [139], t: `Monitor the pressure`, list: [`Y axis: <b>pressure — IVC</b>`] },
];

// Fill in step numbers, part names and photos.
const NO_PHOTO = new Set([10, 16, 19, 22, 25, 32, 43, 57, 61, 66, 71, 81]); // timer / glove rows in the PDF
{
  let part = "Stage A · Top Loader · Unload + Load";
  STEPS.forEach((s, k) => {
    s.n = k + 1;
    part = s.part || part; s.part = part;
    s.photos = (s.photos || s.p).filter(p => !NO_PHOTO.has(p))
      .map(p => typeof p === "string" ? p : `s${String(p).padStart(3, "0")}.jpg`);
  });
}
const stepById = id => STEPS.find(s => s.id === id);

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plain = html => html.replace(/<[^>]+>/g, "");

// i = -1 is the sign-in screen, 0..STEPS.length-1 are steps, STEPS.length is "All done".
let i = -1;
let who = null; // { name, when, samples, finished }
try {
  who = JSON.parse(localStorage.getItem("tl3_who"));
  if (who) i = Math.min(+localStorage.getItem("tl3_step") || 0, STEPS.length);
} catch (e) {}

function save() {
  try { localStorage.setItem("tl3_step", i); localStorage.setItem("tl3_who", JSON.stringify(who)); } catch (e) {}
}

function nowLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16); // for <input type="datetime-local">
}

function pretty(v) {
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
}

// iPhone uses "&body=", Android uses "?body="
function sms(msg) {
  const ios = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  return `sms:${PHONE}${ios ? "&" : "?"}body=${encodeURIComponent(msg)}`;
}

function stuckLink(step) {
  const where = step ? `Step ${step.n} of ${STEPS.length} (${step.part}): "${plain(step.t)}"` : "the start";
  let msg = `Hi Mehdi, I'm stuck at ${where}. Things do not look as usual. What should I do? I need help.`;
  if (who) msg += `\n\nLoading: ${who.samples}\nStarted: ${pretty(who.when)}\n– ${who.name}`;
  return sms(msg);
}

function doneLink() {
  return sms(`Hi Mehdi, I'm done ✅ Sample loaded and measurement running.\n\n` +
    `Loaded sample: ${who.samples}\nStarted: ${pretty(who.when)}\nFinished: ${pretty(who.finished)}\n\n– ${who.name}`);
}

function figs(list) {
  if (!list.length) return "";
  return list.map(src => `<figure><a href="img/${src}" target="_blank"><img src="img/${src}" alt="" onload="if(this.naturalWidth>this.naturalHeight*1.6)this.classList.add('wide')" onerror="this.closest('figure').remove()"></a></figure>`).join("") +
    `<figcaption>Tap a photo to zoom</figcaption>`;
}

// ---- countdown timer for "Wait" steps ----
let tick = null;
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => {
      const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}
function fmt(sec) { return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }
function setupTimer(total) {
  const clock = $("clock"), btn = $("tbtn");
  let left = total;
  btn.onclick = () => {
    clearInterval(tick);
    left = total; clock.textContent = fmt(left); clock.classList.remove("done");
    btn.textContent = "Restart timer";
    const end = Date.now() + total * 1000;
    tick = setInterval(() => {
      left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      clock.textContent = fmt(left);
      if (left === 0) { clearInterval(tick); clock.textContent = "Done ✓"; clock.classList.add("done"); beep(); }
    }, 250);
  };
}

function renderStart() {
  $("part").textContent = "Top Loader";
  $("count").textContent = "";
  $("bar").style.width = "0%";
  const w = who || {};
  $("card").innerHTML = `<h1>Let's start</h1>
    <p style="color:var(--muted)">One action per step. Do them in order. Never force anything. Not sure? STOP and ask.</p>
    <label class="f">Who are you?
      <input id="f-name" autocomplete="name" placeholder="Your name" value="${esc(w.name || "")}"></label>
    <label class="f">Date and time
      <input id="f-when" type="datetime-local" value="${esc(w.when || nowLocal())}"></label>
    <label class="f">What sample(s) are you loading?
      <input id="f-samples" placeholder="e.g. QM122, QM123" value="${esc(w.samples || "")}"></label>
    <p id="f-err" class="err" hidden>Please fill in all three.</p>`;
  $("btns").innerHTML = `<button class="yes" id="go">Start ›</button>
    <a class="btn help" href="${stuckLink(null)}">✋ I need help – text Mehdi</a>`;
  $("go").onclick = () => {
    const name = $("f-name").value.trim(), when = $("f-when").value, samples = $("f-samples").value.trim();
    if (!name || !when || !samples) { $("f-err").hidden = false; return; }
    who = { name, when, samples };
    i = 0; render();
  };
}

function render() {
  clearInterval(tick);
  save();
  window.scrollTo(0, 0);
  if (i < 0) return renderStart();

  const total = STEPS.length;
  $("bar").style.width = (i / total * 100) + "%";

  if (i >= total) {
    if (!who.finished) { who.finished = nowLocal(); save(); }
    $("part").textContent = "Finished";
    $("count").textContent = "";
    $("card").innerHTML = `<div class="big-emoji">✅</div><h1 class="center">All done, ${esc(who.name)}!</h1>
      <p class="center">Sample loaded, measurement running.</p>
      <div class="summary"><b>Loaded:</b> ${esc(who.samples)}<br><b>Started:</b> ${esc(pretty(who.when))}<br><b>Finished:</b> ${esc(pretty(who.finished))}</div>
      <div class="ask">Last thing: tap below and press Send to tell Mehdi you're done.</div>`;
    $("btns").innerHTML = `<a class="btn yes" href="${doneLink()}">📩 Text Mehdi "I'm done"</a>
      <button class="back" id="restart">Start a new exchange</button>
      <button class="back" id="prev">‹ Back to last step</button>`;
    $("restart").onclick = () => { who = { name: who.name }; i = -1; render(); };
    $("prev").onclick = () => { who.finished = null; i--; render(); };
    return;
  }

  const s = STEPS[i];
  $("part").textContent = s.part;
  $("count").textContent = `${s.n} / ${total}`;
  const isCheck = /^Check|LEAK CHECK|^Is the/.test(plain(s.t));
  $("card").innerHTML =
    `<div class="num">${s.n}</div><h1>${s.t}</h1>` +
    (s.list ? `<ul class="todo">${s.list.map(x => `<li>${x}</li>`).join("")}</ul>` : "") +
    (s.timer ? `<div class="timer"><div class="clock" id="clock">${fmt(s.timer)}</div><button id="tbtn">▶ Start timer</button></div>` : "") +
    (s.stop ? `<div class="stop">⚠ ${s.stop}</div>` : "") +
    (s.ok ? `<div class="ok">${s.ok}</div>` : "") +
    figs(s.photos) +
    `<div class="ask">${s.timer ? TIMER_HINT : isCheck ? "Does it look right?" : "Did you do this step?"}</div>`;
  $("btns").innerHTML =
    `<button class="yes" id="yes">✓ Yes, done</button>
     ${s.jump ? `<button class="leak" id="jump">${s.jumpLabel} to step ${stepById(s.jump).n}</button>` : ""}
     <a class="btn help" href="${stuckLink(s)}">✋ I'm stuck – text Mehdi</a>
     <button class="back" id="prev">‹ Back</button>`;
  if (s.timer) setupTimer(s.timer);
  $("yes").onclick = () => { i++; render(); };
  if (s.jump) $("jump").onclick = () => { i = stepById(s.jump).n - 1; render(); };
  $("prev").onclick = () => { i--; render(); };
}

render();
</script>
</body>
</html>
