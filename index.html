<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a44">
<title>Top Loader Steps</title>
<style>
  :root {
    --navy: #1f2a44; --green: #1a9e5c; --red: #d62828; --amber: #fff4d6;
    --bg: #f4f5f7; --card: #fff; --text: #1b1b1b; --muted: #666;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 18px; line-height: 1.45;
    padding: env(safe-area-inset-top) 0 0;
  }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 12px 16px 16px; }
  header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  header .part { font-size: 13px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: .04em; flex: 1; }
  header .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: #dde0e6; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--green); transition: width .3s; }
  .card { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); flex: 1; }
  .num { display: inline-flex; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 99px; background: var(--navy); color: #fff; font-weight: 800; font-size: 20px; align-items: center; justify-content: center; margin-bottom: 10px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  ul, ol { margin: 0 0 10px; padding-left: 22px; }
  li { margin-bottom: 6px; }
  .warn { background: var(--amber); border-left: 5px solid #e0a100; padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  .stop { background: #fde8e8; border-left: 5px solid var(--red); padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  .ok { background: #e3f6ec; border-left: 5px solid var(--green); padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  figure { margin: 14px 0 4px; text-align: center; }
  figure a { display: inline-block; max-width: 100%; }
  figure img { max-width: 100%; max-height: 55vh; width: auto; border-radius: 10px; display: block; margin: 0 auto; }
  figure img.wide { width: 100%; }
  figcaption { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }
  .timer { text-align: center; margin: 18px 0 6px; }
  .timer .clock { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--navy); line-height: 1; }
  .timer .clock.done { color: var(--green); }
  .timer button { margin-top: 12px; background: var(--navy); color: #fff; }
  .ask { font-size: 20px; font-weight: 700; text-align: center; margin: 18px 0 10px; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px;
    position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); }
  button, .btn {
    font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 18px; font-size: 20px;
    cursor: pointer; text-align: center; text-decoration: none; display: block; width: 100%;
  }
  .yes { background: var(--green); color: #fff; }
  .help { background: #fff; color: var(--red); border: 3px solid var(--red); }
  .leak { background: var(--red); color: #fff; }
  .back { background: transparent; color: var(--muted); font-size: 16px; font-weight: 600; padding: 10px; }
  .big-emoji { font-size: 72px; text-align: center; margin: 20px 0 0; }
  .center { text-align: center; }
  label.f { display: block; font-weight: 700; margin-bottom: 16px; }
  label.f input { display: block; width: 100%; margin-top: 6px; font: inherit; font-weight: 400; font-size: 18px;
    padding: 14px; border: 2px solid #cfd3da; border-radius: 12px; background: #fff; color: var(--text); -webkit-appearance: none; }
  label.f input:focus { outline: none; border-color: var(--navy); }
  .err { color: var(--red); font-weight: 700; }
  .summary { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin: 16px 0 0; }
  button:active, .btn:active { transform: scale(.98); }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="part" id="part"></div><div class="count" id="count"></div></header>
  <div class="bar"><div id="bar"></div></div>
  <div class="card" id="card"></div>
  <div class="btns" id="btns"></div>
</div>

<script>
const PHONE = "+19179291264";

// Repeated actions, worded exactly as in quick_checklist_toploader.pdf
const PUMP_OPEN   = `<b>OPEN</b> the pump valve (counter-clockwise)`;
const PUMP_CLOSE  = `<b>CLOSE</b> the pump valve (clockwise, SHUT)`;
const LINE_OPEN   = `<b>OPEN</b> the helium in-line valve (handle <b>ALONG</b> the pipe)`;
const LINE_CLOSE  = `<b>CLOSE</b> the helium in-line valve (handle <b>ACROSS</b> the pipe)`;
const WAIT_1MIN   = ["Wait 1 min (use the timer)", { timer: 60 }];
const WAIT_10S    = ["Wait 10 s (use the timer)", { timer: 10 }];
const NOT_READY   = { stop: "Not YES, or any line not OK → STOP. Do not start. Wait or ask." };

// Step N of the PDF is STEPS[N-1]. Photo for step N is img/sNNN.jpg (none for timer-only steps).
const STEPS = [
  // ---------- Stage A · Top Loader · Unload + Load ----------
  /* 1 */ `Click the <b>Sample Exchange</b> tab`,
  /* 2 */ `Click <b>“IS FRIDGE READY FOR SAMPLE EXCHANGE?”</b>`,
  /* 3 */ [`Check: green box says <b>YES</b>`, NOT_READY],
  /* 4 */ [`Check: every line says <b>OK</b>`, NOT_READY],
  /* 5 */ `Check: black VTI valve is <b>CLOSED</b>`,
  /* 6 */ `Check: helium in-line valve is <b>CLOSED</b> (handle <b>ACROSS</b> the pipe)`,
  /* 7 */ `Attach the rough pump hose firmly`,
  /* 8 */ `Switch the rough pump <b>ON</b> (leave it ON)`,
  /* 9 */ PUMP_OPEN,
  /* 10 */ WAIT_1MIN,
  /* 11 */ PUMP_CLOSE,
  /* 12 */ `<b>OPEN</b> the big cylinder handle (counter-clockwise, to the LEFT)`,
  /* 13 */ `<b>OPEN</b> the small black valve (counter-clockwise)`,
  /* 14 */ `Check: adjuster knob 3 is lined up. <b>Do not turn it</b>`,
  /* 15 */ LINE_OPEN,
  /* 16 */ WAIT_10S,
  /* 17 */ LINE_CLOSE,
  /* 18 */ PUMP_OPEN,
  /* 19 */ WAIT_1MIN,
  /* 20 */ PUMP_CLOSE,
  /* 21 */ LINE_OPEN,
  /* 22 */ WAIT_10S,
  /* 23 */ LINE_CLOSE,
  /* 24 */ PUMP_OPEN,
  /* 25 */ WAIT_1MIN,
  /* 26 */ PUMP_CLOSE,
  /* 27 */ `<b>OPEN</b> the helium in-line valve and <b>LEAVE IT OPEN</b>`,
  /* 28 */ `Unplug cable <b>A</b> (black). Grab the metal ring, not the wire`,
  /* 29 */ `Unplug cable <b>B</b> (orange “Probe”). Grab the metal ring`,
  /* 30 */ `<b>OPEN</b> the black VTI valve`,
  /* 31 */ `Check: needle passes 0 and you hear a hiss`,
  /* 32 */ `Put on clean gloves 🧤`,
  /* 33 */ `Loosen the KF clamp wing-screw`,
  /* 34 */ `Take the KF clamp off`,
  /* 35 */ `Place the ladder. Check it is steady`,
  /* 36 */ `Climb up the ladder`,
  /* 37 */ `Hold the top of the probe stick firmly`,
  /* 38 */ `Lift it straight up, slowly, all the way out`,
  /* 39 */ `Hang the probe stick on the hanger`,
  /* 40 */ `Check the O-ring. If it moved, put it back and align it`,
  /* 41 */ `Put the dust cover on the hole, right away`,
  /* 42 */ `Climb down the ladder`,
  /* 43 */ `Grab the sample from the sides and pull it down (tweezers if cold)`,
  /* 44 */ `Put the sample in the sample box`,
  /* 45 */ `Keep your gloves on 🧤`,
  /* 46 */ `Find the black dot on the probe stick`,
  /* 47 */ `Mount the sample holder: V-cut side → black dot`,
  /* 48 */ `Climb up the ladder (check it is steady)`,
  /* 49 */ `Take the dust cover off the hole`,
  /* 50 */ `Hang the dust cover on the side of the fridge`,
  /* 51 */ `Lower the probe stick straight down into the fridge`,
  /* 52 */ `Check: O-ring sits flat and in place`,
  /* 53 */ `Put the KF clamp back on`,
  /* 54 */ `Tighten the wing-screw. Snug, not over-tight`,
  /* 55 */ `Check: you hear helium blowing out of the VTI valve`,
  /* 56 */ `Plug in cable <b>A</b> (black). Turn the ring to lock`,
  /* 57 */ `Plug in cable <b>B</b> (orange “Probe”). Hold the metal body`,
  /* 58 */ `Climb down the ladder`,
  /* 59 */ LINE_CLOSE,
  /* 60 */ PUMP_OPEN,
  /* 61 */ WAIT_1MIN,
  /* 62 */ `Check: needle reaches <b>–1 bar</b>`,
  /* 63 */ PUMP_CLOSE,
  /* 64 */ `<b>LEAK CHECK:</b> watch the gauge`,
  /* 65 */ ["Wait 2 min (use the timer)", { timer: 120 }],
  /* 66 */ [`Check: needle stayed on <b>–1 bar</b>`, {
            stop: "Needle went up = LEAK → open KF clamp, clean O-ring with cloth + IPA, close clamp, go back to step 59.",
            jump: 59, jumpLabel: "Needle went up → back to step 59" }],
  /* 67 */ `<b>OPEN</b> the helium in-line valve until the gauge shows <b>0 bar</b>`,
  /* 68 */ LINE_CLOSE,
  /* 69 */ PUMP_OPEN,
  /* 70 */ WAIT_1MIN,
  /* 71 */ PUMP_CLOSE,
  /* 72 */ `<b>OPEN</b> the helium in-line valve until the gauge shows <b>0 bar</b>`,
  /* 73 */ LINE_CLOSE,
  /* 74 */ PUMP_OPEN,
  /* 75 */ WAIT_1MIN,
  /* 76 */ PUMP_CLOSE,
  /* 77 */ `Switch the rough pump <b>OFF</b>`,
  /* 78 */ `<b>OPEN</b> the helium in-line valve slowly until the needle is at <b>–0.2 bar</b>`,
  /* 79 */ `Check: needle at <b>–0.2 bar</b> (two marks before 0)`,
  /* 80 */ LINE_CLOSE,
  /* 81 */ `<b>CLOSE</b> the black VTI valve`,
  /* 82 */ `Put the red plastic cap on`,
  /* 83 */ `<b>CLOSE</b> the big cylinder handle (clockwise, to the RIGHT)`,
  /* 84 */ `<b>CLOSE</b> the small black valve (clockwise)`,
  /* 85 */ [`Take your gloves off. Go to the computer`, { ok: "✓ Stage A done → go to the computer" }],

  // ---------- Stage B · Software (VdP only) ----------
  // Part 3 · Register & wire the sample (tab: Samples Wiring)
  /* 86 */ `Click the <b>Samples Wiring</b> tab`,
  /* 87 */ `Need another row? Click <b>+ Add Sample</b>`,
  /* 88 */ `Type each sample ID in <b>Name</b> (e.g. QM122)`,
  /* 89 */ `Check the corner geometry (Rxx, Ryy, Rxy)`,
  /* 90 */ `Type the <b>NW line</b> number for every sample`,
  /* 91 */ `Type the <b>NE line</b> number for every sample`,
  /* 92 */ `Type the <b>SE line</b> number for every sample`,
  /* 93 */ `Type the <b>SW line</b> number for every sample`,
  /* 94 */ `Double-check every line number`,
  /* 95 */ `Tick <b>Rxx</b>`,
  /* 96 */ `Tick <b>Ryy</b>`,
  /* 97 */ `Tick <b>Rxy</b>`,
  // Part 4 · Phases & base settings (tab: Automation)
  /* 98 */ `Click the <b>Automation</b> tab`,
  /* 99 */ `Phase 1 Room-T B sweep: <b>UNTICK</b>`,
  /* 100 */ `Phase 2 Cooldown: <b>TICK</b>`,
  /* 101 */ `Phase 3 Magnet sweep: <b>TICK</b>`,
  /* 102 */ `Phase 4 Hi-res B sweep: <b>TICK</b>`,
  /* 103 */ `Phase 5 Warm-up: <b>TICK</b>`,
  /* 104 */ `Pressure control = <b>Python custom PID</b>`,
  /* 105 */ `Cooldown low P target = <b>7.50 mBar</b>`,
  /* 106 */ `Cooldown base-T threshold = <b>2.50 K</b>`,
  /* 107 */ `Sensitivity Step 1 Room-T = <b>Auto</b>`,
  /* 108 */ `Sensitivity Step 2 Cooldown = <b>Auto</b>`,
  /* 109 */ `Sensitivity Step 3 Magnet sweep = <b>Custom</b> (per-config)`,
  /* 110 */ `Sensitivity Step 4 Hi-res = <b>Smart</b>`,
  /* 111 */ `Sensitivity Step 5 Warm-up = <b>Auto</b>`,
  /* 112 */ `Fixed-mode value = <b>10.000 mV</b>`,
  /* 113 */ `Amplitude = <b>1.000 V</b>`,
  /* 114 */ `Frequency = <b>17.777 Hz</b>`,
  /* 115 */ `Time constant = <b>300 ms</b>`,
  /* 116 */ `Bias resistor = <b>1.000 MΩ</b>`,
  /* 117 */ `Lock-in settle = <b>2.0 s</b>`,
  /* 118 */ `Switch settle (slow phases) = <b>1.00 s</b>`,
  // Part 5 · Magnetic field (B) sweeps
  /* 119 */ `Magnet sweep · Sweep mode = <b>Continuous</b>`,
  /* 120 */ `Magnet sweep · B start = <b>−0.100 T</b>`,
  /* 121 */ `Magnet sweep · B max = <b>6.000 T</b>`,
  /* 122 */ `Magnet sweep · B step = <b>5.0 mT</b>`,
  /* 123 */ `Magnet sweep · Ramp rate = <b>3.00 mT/s</b>`,
  /* 124 */ `Magnet sweep · Ramp-back rate = <b>3.00 mT/s</b>`,
  /* 125 */ `Magnet sweep · Switch settle = <b>1.50 s</b>`,
  /* 126 */ `Hi-res · B start = <b>−0.100 T</b>`,
  /* 127 */ `Hi-res · B stop = <b>6.000 T</b>`,
  /* 128 */ `Hi-res · B step = <b>1.50 mT</b>`,
  /* 129 */ `Hi-res · Ramp rate = <b>2.50 mT/s</b>`,
  /* 130 */ `Hi-res · Post-switch warmup = <b>5.0 s</b>`,
  // Part 6 · Warm-up & output
  /* 131 */ `Warm-up target (heater) = <b>300.0 K</b>`,
  /* 132 */ `Done at (exit condition) = <b>295.0 K</b>`,
  /* 133 */ `Sample interval = <b>10 s</b>`,
  /* 134 */ `Sample / run name: type a name + the date`,
  /* 135 */ `Save folder: keep the current folder`,
  // Part 7 · Start & monitor
  /* 136 */ [`Check every value against this checklist`, { stop: "Not sure about any value? Do NOT start. Ask first." }],
  /* 137 */ `Click <b>Start Automation</b>`,
  /* 138 */ `Watch the log: phase, heater, pressure`,
  /* 139 */ `Check the elapsed time / ETA bar`,
].map((s, k) => {
  const [title, opts] = Array.isArray(s) ? s : [s, {}];
  const n = k + 1;
  return { n, title, ...opts, img: opts.timer || n === 32 || n === 45 || n === 85 ? null : `s${String(n).padStart(3, "0")}.jpg` };
});

function partOf(n) {
  if (n <= 85)  return "Stage A · Top Loader · Unload + Load";
  if (n <= 97)  return "Stage B · Part 3 · Samples Wiring tab";
  if (n <= 118) return "Stage B · Part 4 · Automation tab";
  if (n <= 130) return "Stage B · Part 5 · B sweeps";
  if (n <= 135) return "Stage B · Part 6 · Warm-up & output";
  return "Stage B · Part 7 · Start & monitor";
}

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plain = html => html.replace(/<[^>]+>/g, "");

// i = -1 is the sign-in screen, 0..STEPS.length-1 are steps, STEPS.length is "All done".
let i = -1;
let who = null; // { name, when, samples, finished }
try {
  who = JSON.parse(localStorage.getItem("tl2_who"));
  if (who) i = Math.min(+localStorage.getItem("tl2_step") || 0, STEPS.length);
} catch (e) {}

function save() {
  try { localStorage.setItem("tl2_step", i); localStorage.setItem("tl2_who", JSON.stringify(who)); } catch (e) {}
}

function nowLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16); // for <input type="datetime-local">
}

function pretty(v) {
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
}

// iPhone uses "&body=", Android uses "?body="
function sms(msg) {
  const ios = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  return `sms:${PHONE}${ios ? "&" : "?"}body=${encodeURIComponent(msg)}`;
}

function stuckLink(step) {
  const where = step ? `Step ${step.n} of ${STEPS.length} (${partOf(step.n)}): "${plain(step.title)}"` : "the start";
  let msg = `Hi Mehdi, I'm stuck at ${where}. Things do not look as usual. What should I do? I need help.`;
  if (who) msg += `\n\nLoading: ${who.samples}\nStarted: ${pretty(who.when)}\n– ${who.name}`;
  return sms(msg);
}

function doneLink() {
  return sms(`Hi Mehdi, I'm done ✅ Sample loaded and measurement running.\n\n` +
    `Loaded sample: ${who.samples}\nStarted: ${pretty(who.when)}\nFinished: ${pretty(who.finished)}\n\n– ${who.name}`);
}

function fig(src) {
  return src ? `<figure><a href="img/${src}" target="_blank"><img src="img/${src}" alt="" onload="if(this.naturalWidth>this.naturalHeight*1.6)this.classList.add('wide')" onerror="this.closest('figure').remove()"></a><figcaption>Tap the photo to zoom</figcaption></figure>` : "";
}

// ---- countdown timer for "Wait" steps ----
let tick = null;
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => {
      const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}
function fmt(sec) { return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }
function setupTimer(total) {
  const clock = $("clock"), btn = $("tbtn");
  let left = total;
  btn.onclick = () => {
    clearInterval(tick);
    left = total; clock.textContent = fmt(left); clock.classList.remove("done");
    btn.textContent = "Restart timer";
    const end = Date.now() + total * 1000;
    tick = setInterval(() => {
      left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      clock.textContent = fmt(left);
      if (left === 0) { clearInterval(tick); clock.textContent = "Done ✓"; clock.classList.add("done"); beep(); }
    }, 250);
  };
}

function renderStart() {
  $("part").textContent = "Top Loader";
  $("count").textContent = "";
  $("bar").style.width = "0%";
  const w = who || {};
  $("card").innerHTML = `<h1>Let's start</h1>
    <p style="color:var(--muted)">One action per step. Do them in order. Never force anything. Not sure? STOP and ask.</p>
    <label class="f">Who are you?
      <input id="f-name" autocomplete="name" placeholder="Your name" value="${esc(w.name || "")}"></label>
    <label class="f">Date and time
      <input id="f-when" type="datetime-local" value="${esc(w.when || nowLocal())}"></label>
    <label class="f">What sample(s) are you loading?
      <input id="f-samples" placeholder="e.g. QM122, QM123" value="${esc(w.samples || "")}"></label>
    <p id="f-err" class="err" hidden>Please fill in all three.</p>`;
  $("btns").innerHTML = `<button class="yes" id="go">Start ›</button>
    <a class="btn help" href="${stuckLink(null)}">✋ I need help – text Mehdi</a>`;
  $("go").onclick = () => {
    const name = $("f-name").value.trim(), when = $("f-when").value, samples = $("f-samples").value.trim();
    if (!name || !when || !samples) { $("f-err").hidden = false; return; }
    who = { name, when, samples };
    i = 0; render();
  };
}

function render() {
  clearInterval(tick);
  save();
  window.scrollTo(0, 0);
  if (i < 0) return renderStart();

  const total = STEPS.length;
  $("bar").style.width = (i / total * 100) + "%";

  if (i >= total) {
    if (!who.finished) { who.finished = nowLocal(); save(); }
    $("part").textContent = "Finished";
    $("count").textContent = "";
    $("card").innerHTML = `<div class="big-emoji">✅</div><h1 class="center">All done, ${esc(who.name)}!</h1>
      <p class="center">Sample loaded, measurement running.</p>
      <div class="summary"><b>Loaded:</b> ${esc(who.samples)}<br><b>Started:</b> ${esc(pretty(who.when))}<br><b>Finished:</b> ${esc(pretty(who.finished))}</div>
      <div class="ask">Last thing: tap below and press Send to tell Mehdi you're done.</div>`;
    $("btns").innerHTML = `<a class="btn yes" href="${doneLink()}">📩 Text Mehdi "I'm done"</a>
      <button class="back" id="restart">Start a new exchange</button>
      <button class="back" id="prev">‹ Back to last step</button>`;
    $("restart").onclick = () => { who = { name: who.name }; i = -1; render(); };
    $("prev").onclick = () => { who.finished = null; i--; render(); };
    return;
  }

  const s = STEPS[i];
  $("part").textContent = partOf(s.n);
  $("count").textContent = `${s.n} / ${total}`;
  const isCheck = /^Check|LEAK CHECK/.test(plain(s.title));
  $("card").innerHTML =
    `<div class="num">${s.n}</div><h1>${s.title}</h1>` +
    (s.timer ? `<div class="timer"><div class="clock" id="clock">${fmt(s.timer)}</div><button id="tbtn">▶ Start timer</button></div>` : "") +
    (s.stop ? `<div class="stop">⚠ ${s.stop}</div>` : "") +
    (s.ok ? `<div class="ok">${s.ok}</div>` : "") +
    fig(s.img) +
    `<div class="ask">${s.timer ? "Did the time pass?" : isCheck ? "Does it look right?" : "Did you do this step?"}</div>`;
  $("btns").innerHTML =
    `<button class="yes" id="yes">✓ Yes, done</button>
     ${s.jump ? `<button class="leak" id="jump">${s.jumpLabel}</button>` : ""}
     <a class="btn help" href="${stuckLink(s)}">✋ I'm stuck – text Mehdi</a>
     <button class="back" id="prev">‹ Back</button>`;
  if (s.timer) setupTimer(s.timer);
  $("yes").onclick = () => { i++; render(); };
  if (s.jump) $("jump").onclick = () => { i = s.jump - 1; render(); };
  $("prev").onclick = () => { i--; render(); };
}

render();
</script>
</body>
</html>
